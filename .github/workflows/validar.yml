name: Validar calculadora

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validar cálculo, audio, interfaz y recursos
        run: python3 pruebas/ejecutar.py
      - name: Comprobar título y controles
        run: python3 pruebas/titulo.py --index-only
